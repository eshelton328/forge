name: Rooster firmware

on:
  pull_request:
    paths:
      - 'firmware/**'
      - 'tests/test_cube_diagnostics.py'
      - 'tests/firmware/**'
      - 'boards/alec-main/**'
      - 'boards/alec-controls/**'
      - 'boards/alec-front/**'
      - '.github/workflows/rooster-firmware.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rooster-firmware-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  cube:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2
        with:
          version: '1.4.1'
      - name: Verify source contract and host behavior
        run: |
          python3 -m pip install -r requirements.txt
          python3 firmware/rooster/tools/contract.py
          python3 -m pytest tests/test_cube_diagnostics.py -v
      - name: Compile pinned ESP32-S3 image
        run: python3 firmware/rooster/tools/build.py
      - name: Retain binaries and build identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cube-diagnostics
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .cache/rooster-cube/*/artifacts/*
            .cache/rooster-cube/*/manifest.json
            .cache/rooster-cube/*/compile.log
            .cache/rooster-cube/*/sketch/cube_diag/*
